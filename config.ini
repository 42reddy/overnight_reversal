[KOTAK]
; Kotak Neo Trade API — the ONLY broker orders/cancels/positions go through.
; All secrets live in .env (gitignored): KOTAK_ACCESS_TOKEN (the single
; token from Neo app → More → Trade API → Create New Application),
; KOTAK_MOBILE_NUMBER, KOTAK_UCC, KOTAK_MPIN, KOTAK_TOTP_SECRET (from the
; same page's "register for TOTP" step). Do not put real values back in
; this file — it's tracked in git. See auth.py.get_kotak_client for what
; each one is.
environment    = prod

[UPSTOX]
; Market data ONLY (prior close + LTP in live_engine.py) — Upstox never
; places an order. Just one secret: UPSTOX_ANALYTICS_TOKEN in .env (a
; long-lived, 1-year Analytics Access Token generated by hand in the
; Upstox Developer Console — no daily login needed for it).

[SANDBOX]
; Kotak has no public retail paper-trading environment the way Upstox's
; sandbox was, so "enabled=true" here means a purely LOCAL simulation
; (execution.py) — no network calls to Kotak at all, entries/exits fill
; instantly at the signal price. Good for exercising login → signals →
; sizing → state/log bookkeeping → timing end-to-end; NOT a real
; fill/slippage test. Set to true while testing, false to place real orders.
enabled        = false

[STRATEGY]
; ── Cross-sectional overnight-reversal basket ──────────────────────────
; Every trading day: rank the universe by overnight return (LTP at open vs
; prior close), demeaned cross-sectionally. Long the n_long biggest losers,
; short the n_short biggest winners — n_long + n_short = n_splits, i.e. the
; whole day's capital is always cut into n_splits equal slots, one per name.

; Default starting capital — overridden each morning by the prompt in
; bot.py (you re-enter it daily rather than editing this file).
capital           = 25000
n_long            = 16
n_short           = 14
n_splits          = 30

; Names whose raw overnight move (LTP at open vs prior close, before
; demeaning) is >= this magnitude are skipped — a >=5% gap is more likely
; driven by news/momentum than the mean-reverting effect this strategy bets
; on (e.g. names locked in upper/lower circuit tend to keep running), so
; it's excluded from ranking entirely rather than just down-weighted.
max_overnight_move_pct = 5.0

; Names priced above this are skipped even if they'd otherwise rank in —
; keeps a single slot from being swallowed by one very expensive share.
max_share_price   = 10000

; Flat intraday margin leverage applied to BOTH legs. Nothing is ever held
; overnight (hard exit by exit_deadline), so there's no reason to pay for
; MTF financing on the long leg — both legs sit on the same intraday
; product (see long_product/short_product below) and the same leverage,
; which is also what keeps the basket dollar-neutral (equal notional on
; both sides per slot). The per-ticker "mtf_leverage" field in
; instruments.json is no longer used for sizing.
intraday_leverage = 5

; Kotak Neo product codes — both legs are cash-segment intraday (MIS)
long_product   = MIS
short_product  = MIS

; Per-ticker instrument map (instrument_key / exclude). instrument_key is an
; Upstox-format ISIN key, auto-filled by instrument_master.py — used ONLY
; for Upstox market-data calls (live_engine.py), do not hand-edit it. Kotak
; orders route by trading_symbol (ticker + "-EQ"), not this key — see
; execution.py.
instruments_file = instruments.json

[TIMING]
; In persistent mode (`python bot.py`, no --once) the bot sleeps through
; nights/weekends/holidays and wakes at prep_start each trading day to log
; in, resolve instrument tokens, and pre-fetch prior closes (the slow part —
; one historical-candle call per ticker), finishing well before market_open.
; `python bot.py --once` (old single-day behaviour) ignores prep_start and
; just starts prepping immediately.
prep_start     = 08:45
market_open    = 09:15
entry_cutoff   = 09:20

; This was tuned against Upstox's confirmed-live behaviour (stopped
; accepting fresh intraday exit orders at 15:15, penalty-priced
; auto-square-off after that, confirmed live 2026-08-17). Kotak Neo's own
; MIS auto-square-off cutoff/penalty policy has NOT been separately
; re-verified for this rewrite — check it against your Kotak Neo account
; (typically ~15:15-15:20 for MIS, but confirm rather than assume) before
; relying on 15:00/15:05 as safe headroom here.
exit_start     = 14:55
exit_deadline  = 15:00

[PATHS]
; Note: no token_file here — both Kotak Neo and Upstox now log in
; fresh every trading day (Kotak's session lives inside the client object;
; Upstox's analytics token is a static long-lived secret), so there's
; nothing left to cache to disk.
log_file              = logs/bot.log
trade_log_file        = logs/trade_log.json
state_file            = state/position.json
instrument_cache_file = state/nse_master_cache.json
holidays_file         = holidays.json
