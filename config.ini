[UPSTOX]
; All secrets now live in .env (gitignored) — see .env.example for the list
; of vars: UPSTOX_CLIENT_ID, UPSTOX_CLIENT_SECRET, UPSTOX_REDIRECT_URI,
; UPSTOX_SANDBOX_TOKEN, UPSTOX_USERNAME, UPSTOX_PASSWORD, UPSTOX_PIN_CODE,
; UPSTOX_TOTP_SECRET, UPSTOX_ANALYTICS_TOKEN. Do not put real values back
; in this file — it's tracked in git.

[SANDBOX]
; Set to true to use Upstox sandbox (paper trading) — no real orders placed
enabled        = false

[STRATEGY]
; ── Cross-sectional overnight-reversal basket ──────────────────────────
; Every trading day: rank the universe by overnight return (LTP at open vs
; prior close), demeaned cross-sectionally. Long the n_long biggest losers,
; short the n_short biggest winners — n_long + n_short = n_splits, i.e. the
; whole day's capital is always cut into n_splits equal slots, one per name.

; Default starting capital — overridden each morning by the prompt in
; bot.py (you re-enter it daily rather than editing this file).
capital           = 10000
n_long            = 6
n_short           = 4
n_splits          = 10

; Names whose raw overnight move (LTP at open vs prior close, before
; demeaning) exceeds this magnitude are skipped — a >5% gap is more likely
; driven by news/momentum than the mean-reverting effect this strategy bets
; on, so it's excluded from ranking entirely rather than just down-weighted.
max_overnight_move_pct = 5.0

; Names priced above this are skipped even if they'd otherwise rank in —
; keeps a single slot from being swallowed by one very expensive share.
max_share_price   = 10000

; Flat intraday margin leverage applied to BOTH legs. Nothing is ever held
; overnight (hard exit by exit_deadline), so there's no reason to pay for
; MTF financing on the long leg — both legs sit on the same intraday
; product (see long_product/short_product below) and the same leverage,
; which is also what keeps the basket dollar-neutral (equal notional on
; both sides per slot). The per-ticker "mtf_leverage" field in
; instruments.json is no longer used for sizing.
intraday_leverage = 5

; Limit-order entry price is offset from the signal price by this many bps
; (through the market, in the direction of the trade) to raise fill
; likelihood without chasing the price. e.g. 15 bps on a Rs.1000 stock ~= Rs.1.50.
; Set to 0 to place the LIMIT order at exactly the 09:15 open price (assumes
; a near-certain fill inside the 09:15-09:20 window, no offset needed).
entry_limit_buffer_bps = 0

; Upstox product codes — both legs are cash-segment intraday (I)
long_product   = I
short_product  = I

; Per-ticker instrument map (instrument_key / exclude).
; instrument_key is auto-filled by instrument_master.py — do not hand-edit it.
instruments_file = instruments.json

[TIMING]
; In persistent mode (`python bot.py`, no --once) the bot sleeps through
; nights/weekends/holidays and wakes at prep_start each trading day to log
; in, resolve instrument tokens, and pre-fetch prior closes (the slow part —
; one historical-candle call per ticker), finishing well before market_open.
; `python bot.py --once` (old single-day behaviour) ignores prep_start and
; just starts prepping immediately.
prep_start     = 08:45
market_open    = 09:15
entry_cutoff   = 09:20
exit_start     = 15:15
exit_deadline  = 15:20

[PATHS]
log_file              = logs/bot.log
trade_log_file        = logs/trade_log.json
state_file            = state/position.json
token_file            = state/token.json
instrument_cache_file = state/nse_master_cache.json
holidays_file         = holidays.json
